[package]
name = "coremidi-sys"
version = "3.2.1"
authors = ["Jonas Klesy", "Patrick Reisert", "Renaud Denis <mail@renauddenis.com>"]
description = "Low-level FFI bindings for the CoreMIDI framework"
license = "MIT"
repository = "https://github.com/jonas-k/coremidi-sys"
documentation = "https://docs.rs/coremidi-sys"
categories = ["external-ffi-bindings", "multimedia::audio"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
core-foundation-sys = "0.8.7"

[package.metadata.docs.rs]
default-target = "x86_64-apple-darwin"
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[workspace.lints.clippy]
# Disable the entire pedantic group (highly opinionated/stylistic lints)
pedantic = "allow"

# Disable the nursery group (experimental and unstable lints)
nursery = "allow"

# Disable specific subjective lints from standard categories
redundant_pub_crate = "allow"      # Subjective visibility choices
cognitive_complexity = "allow"     # Arbitrary thresholds for code complexity
match_like_matches_macro = "allow" # Sometimes explicit match blocks are more readable
collapsible_if = "allow"           # Nested if-statements can be cleaner than combined ones
